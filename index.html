:root{--purple:#8d50b4;--pink:#e89bcf;--ink:#574666;--pale:#f8efff;--line:#ead9f2}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:linear-gradient(135deg,#fff0f8,#f3ebff 55%,#e8f8ff);min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.4}header{position:sticky;top:0;z-index:12;padding:14px 15px 10px;background:#fff9ffeb;backdrop-filter:blur(12px);border-bottom:1px solid #f1dff5}.logo{font-weight:900;color:var(--purple);font-size:23px;text-align:center;letter-spacing:.2px;text-shadow:1px 2px #fff}.sub{text-align:center;font-size:10px;color:#b07db8;letter-spacing:2px}.layout{max-width:760px;margin:auto;padding:14px 14px 110px}h2{font-size:17px;color:#9054ac;margin:11px 0}.card{background:#fff;border:1px solid #f0dff2;border-radius:18px;padding:12px;box-shadow:0 3px 12px #ac78ad11}.btn{background:linear-gradient(100deg,#e99cce,#aa8ce5);color:white;border:0;border-radius:12px;padding:11px 14px;font-weight:700}.btn.secondary{background:#f7e9f8;color:#9258aa}.btn.outline{background:#fff;color:#965daa;border:1px solid #e6cfec}.btn.tiny{font-size:12px;padding:7px 10px;border-radius:9px}.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}.muted{color:#99859e;font-size:12px}.small{font-size:12px}.pill{border:1px solid #e6d4ed;border-radius:99px;padding:7px 10px;background:white;color:#8a679a;font-size:12px}.pill.active{background:#dbbaed;color:#724794;border-color:#dbbaed}.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.outfit{padding:8px;position:relative;text-align:center}.name{font-size:12px;font-weight:700;overflow-wrap:anywhere;margin-top:6px}.tag{display:inline-block;font-size:10px;color:#9162a9;background:#f7eafa;border-radius:8px;padding:3px 6px}.my{position:absolute;right:7px;top:7px;background:#f1d7f3;color:#8c4da5;border-radius:20px;padding:3px 7px;font-size:10px;font-weight:800}.preview{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;gap:0;min-height:180px;border-radius:13px;background:radial-gradient(circle at 20% 20%,#fff9 1px,transparent 3px),radial-gradient(circle at 80% 40%,#fff 2px,transparent 4px),linear-gradient(145deg,#ffe1f3,#e6e1ff,#dff7ff);background-size:44px 55px,67px 49px,auto}.preview.large{height:350px;min-height:350px}.part-art{object-fit:contain;display:block;max-width:88%;height:auto;position:relative;z-index:1;flex-shrink:0}.part-emoji{display:flex;align-items:center;justify-content:center;z-index:1;color:#ab83bb;opacity:.8}.part-emoji svg{width:32px;height:32px;stroke-width:1.5}.partrow.top .part-emoji svg{width:43px;height:43px}.partrow.shoes .part-emoji svg{width:30px;height:30px}.no-image-note{font-size:9px;color:#9b80a8;text-align:center}.mycatalogitem{min-width:0}.mycatalogitem>.outfit{width:100%;height:auto}.myactions{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px}.myactions button{border:0;background:transparent;color:#917b9f;text-decoration:underline;font-size:11px;padding:5px}.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.pastezone:empty::before{content:"ここを長押しして「ペースト」";color:#926da0}.pastezone:focus{outline:2px solid #cba6df}.pastezone img{max-width:90px;max-height:60px}.placeholder{font-size:11px;color:#997dab;padding:10px}.preview .decor{position:absolute;inset:0;pointer-events:none;font-size:13px;color:#d99bd3}.preview .decor:after{content:'✧  ⋆  ♡  ✦';position:absolute;right:5px;bottom:9px}.preview .decor:before{content:'✦  ♡  ✧';position:absolute;left:8px;top:8px}.partrow{display:flex;align-items:center;justify-content:center;width:100%;min-height:32px}.partrow.top{min-height:65px}.partrow.bottom{min-height:48px}.partrow.shoes{min-height:38px}.partrow.accessory{min-height:34px}.preview.large .partrow{transform:scale(1.2);margin:8px 0}.slot{width:100%;border:1.5px dashed #cfacd7;border-radius:12px;background:#ffffff77;color:#9765ac;min-height:45px;padding:7px;display:flex;justify-content:center;align-items:center;gap:8px}.slot.has{border:0;background:transparent}.slot small{font-size:10px}.slot .part-art{max-height:80px}.slot.accessory .part-art{max-height:44px}.slot.shoes .part-art{max-height:54px}.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fffdfef2;backdrop-filter:blur(12px);border-top:1px solid #edd9f2;display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:15}.tabbar button{width:25%;max-width:175px;border:0;background:transparent;color:#a086aa;padding:6px 0;border-radius:12px;font-size:11px}.tabbar button.on{background:#f5e4f7;color:#8750a8;font-weight:800}.tabbar svg{display:block;margin:0 auto 3px}.tabbar span{display:block}input,select,textarea{width:100%;min-height:42px;background:#fff;border:1px solid #e4d2e8;border-radius:11px;padding:9px;color:#5c4d65;outline-color:#ba87d2}label{display:block;font-size:12px;color:#8e6b9c;margin:9px 0 4px}input[type=checkbox]{width:auto;min-height:auto;accent-color:#aa6cc6}.modal{position:fixed;inset:0;background:#36244172;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fffafd;width:100%;max-width:760px;max-height:88dvh;border-radius:22px 22px 0 0;padding:16px;overflow:auto;box-shadow:0 -9px 25px #49335930}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.close{border:0;background:#f7e8f8;color:#8959a0;padding:8px 12px;border-radius:10px}.gridparts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.parttile{text-align:center;border:1px solid #edd9f0;border-radius:13px;padding:7px;background:#fff}.parttile .preview{min-height:110px;height:110px}.parttile .part-art{max-height:70px}.sectionlabel{margin:18px 0 8px;color:#9254a9;font-size:14px;font-weight:800}.stack{display:grid;gap:10px}.divider{height:1px;background:#f0e5f2;margin:10px 0}.status{background:#eff9f3;color:#48816c;padding:9px;border-radius:10px;font-size:12px}.danger{color:#b54e74}.empty{text-align:center;padding:35px 16px;color:#9c81ab}.switch{padding:7px 10px;border-radius:99px;border:1px solid #e4ccec;background:#fff;color:#9163a8;font-size:12px}.switch.selected{background:#e9d0f5}.float{display:flex;gap:7px;justify-content:flex-end;margin-top:10px}.settingline{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#fff;border-radius:12px;border:1px solid #ecddf0;margin-bottom:8px}.hidden{display:none!important}.footnote{font-size:11px;color:#98829b;line-height:1.7;margin-top:12px}a{color:var(--purple)}
</style></head><body><header><div class="logo">✦ My Pri Closet ✦</div><div class="sub">♡ COORDINATE COLLECTION ♡</div></header><main class="layout" id="app"></main><nav class="tabbar" id="tabs"></nav><div id="overlay"></div>
<script>
(()=>{'use strict';
const STORAGE='my-pri-closet-v03',SLOTS=['accessory','tops','bottom','shoes'],LABEL={accessory:'アクセ',tops:'トップス・ワンピ',bottom:'ボトムス',shoes:'シューズ'},ICON={accessory:'🎀',tops:'👗',bottom:'🩳',shoes:'👠'},ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const examples=[{id:'demo01',name:'ゆめいろスター',series:'おためしシリーズ',brand:'スターリボン',rarity:'★4',items:[['accessory','スターリボンアクセ','🎀'],['tops','ゆめいろワンピ','👗'],['shoes','ゆめいろシューズ','👠']]},{id:'demo02',name:'きらめきパステル',series:'おためしシリーズ',brand:'キャンディポップ',rarity:'★3',items:[['accessory','ジュエルアクセ','👑'],['tops','パステルトップス','👚'],['bottom','パステルスカート','👗'],['shoes','リボンブーツ','👢']]},{id:'demo03',name:'ミントマジック',series:'おためしシリーズ',brand:'ミントドロップ',rarity:'★2',items:[['tops','ミントトップス','🧥'],['bottom','ミントボトムス','🩳'],['shoes','ミントシューズ','👟']]},{id:'demo04',name:'ロイヤルパープル',series:'おためしシリーズ',brand:'ムーンジュエル',rarity:'★4',items:[['accessory','ティアラ','👑'],['tops','ロイヤルワンピ','👗'],['shoes','ロイヤルパンプス','👠']]}];
function init(){let parts=[],sets=[];examples.forEach(x=>{let ids=[];x.items.forEach((p,j)=>{let id=x.id+'_'+p[0];parts.push({id,setId:x.id,type:p[0],name:p[1],emoji:p[2],onepiece:p[0]==='tops'&&p[1].includes('ワンピ'),brand:x.brand,rarity:x.rarity,series:x.series,source:'official'});ids.push(id)});sets.push({id:x.id,name:x.name,series:x.series,brand:x.brand,rarity:x.rarity,partIds:ids,source:'official'})});return {parts,sets,owned:[],wanted:[],tags:{},albums:[],settings:{seriesOrder:[]}}}
let db;try{db=JSON.parse(localStorage.getItem(STORAGE)||'null')}catch{};if(!db||!Array.isArray(db.parts)){db=init()}db={...init(),...db};let page='catalog',catalogMode='sets',filter='',onlyOwned=false,onlyWanted=false,albumFav=false,editAlbum=null,work={},modal='',partType='',partSearch='',partOnlyOwned=false,catalogSeries='',admin=false,chosen=new Set(),statusText='',imageTarget='';
const part=id=>db.parts.find(p=>p.id===id),set=id=>db.sets.find(s=>s.id===id),owned=id=>db.owned.includes(id),wanted=id=>db.wanted.includes(id),save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(db))}catch(e){alert('保存領域が足りません。設定からバックアップを取って、画像の容量を減らしてください。')}};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);function setFlag(kind,id,value){let a=db[kind];db[kind]=value?[...new Set([...a,id])]:a.filter(v=>v!==id);if(kind==='owned'&&value)db.wanted=db.wanted.filter(x=>x!==id);save();render()}
const PART_ICONS={accessory:'<path d="M12 10c-3-5-8-5-8-1s5 4 8 3c3 1 8 1 8-3s-5-4-8 1Z"/><circle cx="12" cy="12" r="2"/><path d="m11 14-3 6-1-5m6-1 3 6 1-5"/>',tops:'<path d="m8 3 4 3 4-3 5 5-3 4-2-2v11H8V10l-2 2-3-4 5-5Z"/>',bottom:'<path d="M6 3h12l2 18h-6l-2-10-2 10H4L6 3Z"/>',shoes:'<path d="M3 12c3 1 5 0 7-5l3 3 1 4 6 2c1 .4 2 2 1 4H3v-8Zm0 5h18"/>'};
function partIcon(type){return `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${PART_ICONS[type]||PART_ICONS.tops}</svg>`}
const artwork=(p)=>p?.image?`<img class="part-art" alt="${ESC(p.name||'')}" src="${p.image}">`:`<span class="part-emoji" aria-label="画像未登録">${partIcon(p?.type)}</span>`;
function preview(ids,large=false){let map={};(ids||[]).forEach(id=>{let p=part(id);if(p)map[p.type]=p});let op=map.tops?.onepiece;return `<div class="preview ${large?'large':''}"><span class="decor"></span>${SLOTS.filter(t=>t!=='bottom'||!op).map(t=>`<div class="partrow ${t==='tops'?'top':t==='bottom'?'bottom':t}" style="${t==='tops'&&op?'min-height:95px':''}">${map[t]?artwork(map[t]):''}</div>`).join('')}${!Object.keys(map).length?'<span class="placeholder">画像未登録</span>':''}</div>`}
const TAB_ICONS={catalog:'<path d="M12 7v14m0-14C9.5 5.5 6.5 5 3 5v14c3.5 0 6.5.5 9 2m0-14c2.5-1.5 5.5-2 9-2v14c-3.5 0-6.5.5-9 2"/>',builder:'<path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Zm7 13 .7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"/>',album:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m7 14 3-3 3 3 4-5 2 2M7 18h10"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M10 2h4l.6 2.5a8 8 0 0 1 1.9.8l2.2-1.4 2.8 2.8-1.4 2.2c.35.6.6 1.2.8 1.9L23 11v4l-2.5.6a8 8 0 0 1-.8 1.9l1.4 2.2-2.8 2.8-2.2-1.4a8 8 0 0 1-1.9.8L14 24h-4l-.6-2.5a8 8 0 0 1-1.9-.8l-2.2 1.4-2.8-2.8 1.4-2.2a8 8 0 0 1-.8-1.9L1 15v-4l2.5-.6c.2-.7.45-1.3.8-1.9L2.9 6.3l2.8-2.8 2.2 1.4a8 8 0 0 1 1.9-.8L10 2Z" transform="translate(1.7 1.7) scale(.86)"/>'};
function navIcon(k){return `<svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${TAB_ICONS[k]}</svg>`}
function drawTabs(){document.getElementById('tabs').innerHTML=[['catalog','図鑑'],['builder','コーデ'],['album','アルバム'],['settings','設定']].map(x=>`<button type="button" data-tab="${x[0]}" class="${x[0]===page?'on':''}" aria-label="${x[1]}" ${x[0]===page?'aria-current="page"':''}>${navIcon(x[0])}<span>${x[1]}</span></button>`).join('')}
function render(){const oldSheet=document.querySelector('#overlay .sheet');const priorModal=oldSheet?.dataset.modal;const oldScroll=oldSheet?.scrollTop||0;drawTabs();document.getElementById('app').innerHTML=page==='catalog'?catalog():page==='builder'?builder():page==='album'?album():settings();drawModal();if(modal&&modal===priorModal){const newSheet=document.querySelector('#overlay .sheet');if(newSheet)newSheet.scrollTop=oldScroll}}
function heading(s,right=''){return `<div class="row" style="justify-content:space-between"><h2>${s}</h2>${right}</div>`}
function catalog(){let term=filter.toLowerCase(),records= (catalogMode==='sets'?db.sets:db.parts).filter(x=>{let ids=catalogMode==='sets'?x.partIds:[x.id];return (!catalogSeries||x.series===catalogSeries)&&(!onlyOwned||ids.some(owned))&&(!onlyWanted||ids.some(wanted))&&[x.name,x.brand,x.rarity,x.series,...ids.map(id=>part(id)?.name)].join(' ').toLowerCase().includes(term)});let series=[...new Set(records.map(x=>x.series||'シリーズ未設定'))];return `${heading('✧ コーデ図鑑',`<button class="btn tiny secondary" data-act="goto-admin">＋ MY登録</button>`)}<div class="row" style="margin-bottom:10px"><button class="pill ${catalogMode==='sets'?'active':''}" data-act="mode" data-value="sets">一式コーデ</button><button class="pill ${catalogMode==='parts'?'active':''}" data-act="mode" data-value="parts">単品パーツ</button></div><input id="filter" placeholder="名前・ブランド・レアリティで検索" value="${ESC(filter)}"><div class="row wrap" style="margin:9px 0"><button class="pill ${onlyOwned?'active':''}" data-act="ownedfilter">✓ 所持のみ</button><button class="pill ${onlyWanted?'active':''}" data-act="wantfilter">☆ ほしいもののみ</button><select id="seriesFilter" style="width:auto;max-width:100%;min-height:34px"><option value="">全シリーズ</option>${[...new Set((catalogMode==='sets'?db.sets:db.parts).map(s=>s.series||'シリーズ未設定'))].map(s=>`<option ${s===catalogSeries?'selected':''}>${ESC(s)}</option>`).join('')}</select></div>${records.length?series.map(s=>`<div class="sectionlabel">✦ ${ESC(s)}</div><div class="catalog">${records.filter(x=>(x.series||'シリーズ未設定')===s).map(x=>{let ids=catalogMode==='sets'?x.partIds:[x.id];return `<div class="mycatalogitem"><button class="card outfit" data-act="detail" data-id="${x.id}" data-kind="${catalogMode}">${x.source==='mine'?'<span class="my">MY ♡</span>':''}${preview(ids)}<div class="name">${ESC(x.name)}</div><div class="tag">${ESC(x.brand||'ブランド未設定')}</div><div class="small" style="margin-top:4px">${ids.filter(owned).length}/${ids.length} 所持</div></button>${x.source==='mine'?`<div class="myactions"><button data-act="edit-my" data-kind="${catalogMode}" data-id="${x.id}">編集</button><button data-act="delete-my" data-kind="${catalogMode}" data-id="${x.id}">削除</button></div>`:''}</div>`}).join('')}</div>`).join(''):'<div class="empty">条件に合うコーデが見つからなかったよ ♡</div>'}<p class="footnote">表示中の4セットは架空のサンプルです。実際の公式データは未収録です。</p>`}
function builder(){let top=part(work.tops),slots=SLOTS.filter(t=>t!=='bottom'||!top?.onepiece);return `${heading('✧ ミックスコーデ',`<button class="btn tiny secondary" data-act="clear">最初から</button>`)}<p class="muted">＋または画像をタップしてパーツを選ぼう ♡</p><div class="card"><div class="preview large" style="height:auto;min-height:345px;padding:15px 22px;gap:3px"><span class="decor"></span>${slots.map(t=>`<div style="width:100%;max-width:200px"><button class="slot ${work[t]?'has':''} ${t}" data-act="choose" data-type="${t}">${work[t]?artwork(part(work[t])):`<span>＋ ${LABEL[t]}</span>`}</button></div>`).join('')}</div><div class="float"><button class="btn secondary" data-act="clear">リセット</button><button class="btn" data-act="save-coord" ${SLOTS.some(x=>work[x])?'':'disabled'}>${editAlbum?'変更を上書き保存 ♡':'アルバムに保存 ♡'}</button></div></div><p class="footnote">未完成でも1パーツ以上あれば保存OK。保存後は選択がリセットされます。保存前の組み合わせはアプリ再読み込み時に消えます。</p>`}
function album(){let records=db.albums.filter(a=>(!albumFav||a.favorite)&&[a.name,...(a.tags||[])].join(' ').toLowerCase().includes(filter.toLowerCase()));return `${heading('♡ マイアルバム')}<input id="filter" value="${ESC(filter)}" placeholder="コーデ名・タグで検索"><div class="row wrap" style="margin:10px 0"><button class="pill ${albumFav?'active':''}" data-act="albumfav">♡ お気に入りのみ</button><span class="muted">${records.length}件</span></div>${records.length?`<div class="catalog">${[...records].reverse().map(a=>`<button class="card outfit" data-act="albumdetail" data-id="${a.id}">${preview(a.partIds)}<div class="name">${a.favorite?'💗 ':''}${ESC(a.name)}</div><div class="muted">${(a.tags||[]).map(t=>'#'+ESC(t)).join(' ')}</div></button>`).join('')}</div>`:'<div class="empty">まだコーデがないよ ♡<br>「コーデ」から組み合わせて保存してね！</div>'}`}

function close(){modal='';render()}function show(x){modal=x;render()}function dataFile(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function readFile(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f)})}function readImage(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}function parseCSV(s){let rows=[],row=[],field='',quote=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){field+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);let cols=rows.shift()?.map(x=>x.trim().replace(/^\uFEFF/,''))||[];return rows.map(row=>Object.fromEntries(cols.map((c,i)=>[c,(row[i]||'').trim()]))) }
async function compressImage(blob){if(!blob || !blob.type.startsWith('image/'))throw Error('画像ファイルを選んでね');const url=URL.createObjectURL(blob);try{let img=await new Promise((ok,err)=>{let im=new Image();im.onload=()=>ok(im);im.onerror=()=>err(Error('画像を開けませんでした'));im.src=url}),scale=Math.min(1,600/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);let pixels=ctx.getImageData(0,0,w,h).data,transparent=false;for(let i=3;i<pixels.length;i+=4){if(pixels[i]<250){transparent=true;break}}let mime=transparent?'image/webp':'image/jpeg';let data=canvas.toDataURL(mime,transparent?.78:.75);if(data.startsWith('data:image/png'))data=canvas.toDataURL('image/png');return data}finally{URL.revokeObjectURL(url)}}
async function storeImage(blob,id){try{let p=part(id);if(!p)throw Error('対象パーツが見つかりません');let compressed=await compressImage(blob),previous=p.image;p.image=compressed;try{localStorage.setItem(STORAGE,JSON.stringify(db))}catch(err){p.image=previous;throw Error('端末内の保存領域が足りません。バックアップして画像を整理してください')}show('detail:parts:'+id);alert('画像を軽量化して登録したよ ♡')}catch(err){alert(err.message||'画像の登録に失敗しました')}}
async function imageFromClipboard(){try{if(!navigator.clipboard?.read)throw Error('Safariではボタンからクリップボードの画像を読めない場合があります。上の欄を長押しして「ペースト」を試してね。');const clips=await navigator.clipboard.read();for(const clip of clips){let type=clip.types.find(t=>t.startsWith('image/'));if(type){await storeImage(await clip.getType(type),imageTarget);return}}throw Error('コピーした内容に画像がありません。リンクではなく画像そのものをコピーしてね。')}catch(err){alert(err.message||'貼り付けできませんでした')}}

document.addEventListener('click',async e=>{let el=e.target.closest('[data-tab],[data-act]');if(!el)return;if(el.dataset.tab)return go(el.dataset.tab);let a=el.dataset.act,id=el.dataset.id;
