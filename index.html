<script>

const examples=[{id:'demo01',name:'ゆめいろスター',series:'おためしシリーズ',brand:'スターリボン',rarity:'★4',items:[['accessory','スターリボンアクセ','🎀'],['tops','ゆめいろワンピ','👗'],['shoes','ゆめいろシューズ','👠']]},{id:'demo02',name:'きらめきパステル',series:'おためしシリーズ',brand:'キャンディポップ',rarity:'★3',items:[['accessory','ジュエルアクセ','👑'],['tops','パステルトップス','👚'],['bottom','パステルスカート','👗'],['shoes','リボンブーツ','👢']]},{id:'demo03',name:'ミントマジック',series:'おためしシリーズ',brand:'ミントドロップ',rarity:'★2',items:[['tops','ミントトップス','🧥'],['bottom','ミントボトムス','🩳'],['shoes','ミントシューズ','👟']]},{id:'demo04',name:'ロイヤルパープル',series:'おためしシリーズ',brand:'ムーンジュエル',rarity:'★4',items:[['accessory','ティアラ','👑'],['tops','ロイヤルワンピ','👗'],['shoes','ロイヤルパンプス','👠']]}];

function colorMatches(p){if(!catalogColor)return true;return catalogColorMode==='main'?p.mainColor===catalogColor:catalogColorMode==='sub'?p.subColor===catalogColor:p.mainColor===catalogColor||p.subColor===catalogColor}
function filteredCatalog(){let term=filter.toLowerCase();return (catalogMode==='sets'?db.sets:db.parts).filter(x=>{
 if(db.sets.some(s=>s.source==='official-csv')&&x.series==='おためしシリーズ'&&!db.owned.includes(x.id)&&!db.wanted.includes(x.id)&&!db.albums.some(a=>a.partIds.some(pid=>x.partIds?.includes(pid)||x.id===pid)))return false;
 const ids=catalogMode==='sets'?x.partIds:[x.id],parts=ids.map(part).filter(Boolean);
 return (!catalogSeries||x.series===catalogSeries)&&(!catalogRound||x.round===catalogRound)&&(!catalogRarity||x.rarity===catalogRarity)&&(!catalogAcquisition||x.acquisition===catalogAcquisition)&&(!catalogBrand||x.brand===catalogBrand)&&(!catalogPartType||parts.some(p=>p.type===catalogPartType))&&(!onlyOwned||ids.some(owned))&&(!onlyWanted||ids.some(wanted))&&(!catalogColor||parts.some(colorMatches))&&(!catalogMinBuzz||parts.some(p=>p.buzzPower!=null&&p.buzzPower>=Number(catalogMinBuzz)))&&(!catalogMaxBuzz||parts.some(p=>p.buzzPower!=null&&p.buzzPower<=Number(catalogMaxBuzz)))&&[x.name,x.brand,x.rarity,x.series,x.round,x.acquisition,...parts.map(p=>p.name),...parts.map(p=>p.partCode||'')].join(' ').toLowerCase().includes(term);
 })}

return `${heading('✧ コーデ図鑑',`<button class="btn tiny secondary" data-act="goto-admin">＋ MY登録</button>`)}<div class="row" style="margin-bottom:10px"><button class="pill ${catalogMode==='sets'?'active':''}" data-act="mode" data-value="sets">一式コーデ</button><button class="pill ${catalogMode==='parts'?'active':''}" data-act="mode" data-value="parts">単品パーツ</button></div><input id="filter" placeholder="コーデ名・パーツ名・品番を検索" value="${ESC(filter)}"><div class="row wrap" style="margin:9px 0"><button class="pill ${onlyOwned?'active':''}" data-act="ownedfilter">✓ 所持のみ</button><button class="pill ${onlyWanted?'active':''}" data-act="wantfilter">☆ ほしいもののみ</button></div><details class="filter-details"><summary>詳細絞り込み <span class="muted">シリーズ・弾・レアリティ・色・バズパワー</span></summary><div class="stack" style="gap:7px;margin-top:10px"><label>シリーズ</label>${selectOpts('series',[...new Set(all.map(x=>x.series))],catalogSeries)}<div class="row"><div class="grow"><label>弾</label>${selectOpts('round',[...new Set(all.map(x=>x.round))],catalogRound)}</div><div class="grow"><label>レアリティ</label>${selectOpts('rarity',[...new Set(all.map(x=>x.rarity))],catalogRarity)}</div></div><label>入手区分</label>${selectOpts('acquisition',[...new Set(all.map(x=>x.acquisition))],catalogAcquisition)}<label>ブランド</label>${selectOpts('brand',[...new Set(all.map(x=>x.brand))],catalogBrand)}<label>パーツ種類</label>${selectOpts('partType',SLOTS.map(t=>t),catalogPartType)}<label>色</label><div class="color-chips"><button class="color-chip ${!catalogColor?'active':''}" data-act="color-filter" data-value="">すべて</button>${Object.keys(COLOR_NAMES).map(c=>`<button class="color-chip ${catalogColor===c?'active':''}" data-act="color-filter" data-value="${c}"><span style="background:${COLOR_HEX[c]}"></span>${COLOR_NAMES[c]}</button>`).join('')}</div><div class="row"><button class="pill ${catalogColorMode==='both'?'active':''}" data-act="color-mode" data-value="both">両方</button><button class="pill ${catalogColorMode==='main'?'active':''}" data-act="color-mode" data-value="main">メイン</button><button class="pill ${catalogColorMode==='sub'?'active':''}" data-act="color-mode" data-value="sub">サブ</button></div><label>バズパワー（パーツごと）</label><div class="row"><input id="minBuzz" inputmode="numeric" type="number" min="0" placeholder="下限" value="${ESC(catalogMinBuzz)}"><span>〜</span><input id="maxBuzz" inputmode="numeric" type="number" min="0" placeholder="上限" value="${ESC(catalogMaxBuzz)}"></div><button class="btn tiny outline" data-act="clear-filters">絞り込みをクリア</button></div></details><div class="muted" style="margin:9px 0"><span id="catalogCount">${records.length}件</span> · 公式CSV：${ESC(officialLoadStatus)}</div><div id="searchResults">${records.length?series.map(s=>`<div class="sectionlabel">✦ ${ESC(s)}</div><div class="catalog">${records.filter(x=>(x.series||'シリーズ未設定')===s).map(x=>{let ids=catalogMode==='sets'?x.partIds:[x.id];return `<div class="mycatalogitem"><button class="card outfit" data-act="detail" data-id="${ESC(x.id)}" data-kind="${catalogMode}">${x.source==='mine'?'<span class="my">MY ♡</span>':''}${catalogMode==='sets'?setArtwork(x):preview(ids,false,true)}<div class="name">${ESC(x.name)}</div><div class="tag">${ESC(x.round||x.brand||'')}</div><div class="small" style="margin-top:4px">${ids.length?`${ids.filter(owned).length}/${ids.length} 所持`:'パーツ情報確認中'}</div></button>${x.source==='mine'?`<div class="myactions"><button data-act="edit-my" data-kind="${catalogMode}" data-id="${ESC(x.id)}">編集</button><button data-act="delete-my" data-kind="${catalogMode}" data-id="${ESC(x.id)}">削除</button></div>`:''}</div>`}).join('')}</div>`).join(''):'<div class="empty">条件に合うコーデが見つからなかったよ ♡</div>'}</div><p class="footnote">公式CSVは公開GitHubの同じフォルダから読み込むよ。画像・QR・所持情報はこの端末内に保存されます。</p>`}
function builder(){let top=part(work.tops),slots=SLOTS.filter(t=>t!=='bottom'||!top?.onepiece);return `${heading('✧ ミックスコーデ',`<button class="btn tiny secondary" data-act="clear">最初から</button>`)}<p class="muted">＋または画像をタップしてパーツを選ぼう ♡</p><div class="card"><div class="preview large" style="height:auto;min-height:320px;padding:14px 16px;gap:4px"><span class="decor"></span>${slots.map(t=>`<div style="width:100%;max-width:190px"><button class="slot ${work[t]?'has':''} ${t}" data-act="choose" data-type="${t}">${work[t]?artwork(part(work[t]),true):`<span>＋ ${LABEL[t]}</span>`}</button></div>`).join('')}</div><div class="float"><button class="btn secondary" data-act="clear">リセット</button><button class="btn" data-act="save-coord" ${SLOTS.some(x=>work[x])?'':'disabled'}>${editAlbum?'変更を上書き保存 ♡':'アルバムに保存 ♡'}</button></div></div><p class="footnote">画像のサイズは自動で見やすく調整します。未完成でも1パーツ以上あれば保存OK。保存後は選択がリセットされます。</p>`}
function album(){let records=db.albums.filter(a=>(!albumFav||a.favorite)&&[a.name,...(a.tags||[])].join(' ').toLowerCase().includes(filter.toLowerCase()));return `${heading('♡ マイアルバム')}<input id="filter" value="${ESC(filter)}" placeholder="コーデ名・タグで検索"><div class="row wrap" style="margin:10px 0"><button class="pill ${albumFav?'active':''}" data-act="albumfav">♡ お気に入りのみ</button><span class="muted" id="searchCount">${records.length}件</span></div><div id="searchResults">${records.length?`<div class="catalog">${[...records].reverse().map(a=>`<button class="card outfit" data-act="albumdetail" data-id="${a.id}">${albumArtwork(a)}<div class="name">${a.favorite?'💗 ':''}${ESC(a.name)}</div><div class="muted">${(a.tags||[]).map(t=>'#'+ESC(t)).join(' ')}</div></button>`).join('')}</div>`:'<div class="empty">まだコーデがないよ ♡<br>「コーデ」から組み合わせて保存してね！</div>'}</div>`}
function settings(){return `${heading('⚙️ 設定')}<div class="stack"><button class="settingline" data-act="goto-admin"><span>♡ MYデータ管理</span><span>›</span></button><button class="settingline" data-act="export"><span>💾 バックアップを書き出す</span><span>›</span></button><button class="settingline" data-act="restore"><span>📥 バックアップを読み込む</span><span>›</span></button><button class="settingline" data-act="reset"><span class="danger">🗑 サンプル含む全データを初期化</span><span>›</span></button></div><p class="footnote">v0.3.8。QR読み取り・再生成は外部のオープンソースライブラリの読み込みが必要です。QRデータは公開サーバーに送信せず端末内に保存します。データはこのブラウザ・端末内に保存されます。更新・機種変更・ブラウザデータ削除の前にはバックアップを取ってね。公式図鑑はGitHub Pagesのonegai_4dan_catalog.csvを読み込みます。更新前のバックアップをおすすめします。</p>`}

 html=`<div class="modalhead"><b>▦ ${kind==='set'?'一式':'パーツ'}QR：${ESC(x.name)}</b><button class="close" data-act="qr-back">×</button></div><p class="qr-notice">${kind==='set'?'フルコーデガチャ用のQRです。':'このパーツのQRは、使用しているアルバムのコーデにも自動反映されます。'}QRは端末内のデータとして保存し、公開サイトには送信しないよ。</p>${entry?`<div class="qr-display" id="qrRender">${entry.text?'<div class="qr-status">QRを生成中…</div>':`<img class="fallback-img" src="${entry.image}" alt="保存されたQR画像">`}</div><div class="row wrap"><button class="btn tiny outline" data-act="delete-qr" data-kind="${kind}" data-id="${id}">QRを削除</button></div>`:'<p class="muted">まだQRが登録されていません。</p>'}<div class="sectionlabel">写真からQRを登録</div><label class="qr-select">写真・ファイルを選ぶ<input id="qrFile" type="file" accept="image/*"></label><label class="qr-select">カメラで撮影<input id="qrCamera" type="file" accept="image/*" capture="environment"></label><button class="btn" style="width:100%" data-act="register-qr" data-kind="${kind}" data-id="${id}">QRを読み取って保存</button><div id="qrFeedback" class="qr-status" role="status"></div><p class="footnote">読み取れなくても写真を保存できるよ。元の写真は解析・画像保存のため端末内で扱います。外部ライブラリが読み込めない場合、QRデータの読み取りと再生成はできません。</p>`

oggle-want" data-id="${id}" ${owned(id)?'disabled':''}>☆</button></span></div>`}).join('')}<div class="row wrap" style="margin-top:12px"><button class="btn secondary" data-act="all-owned" data-ids="${ids.join(',')}">一式所持</button><button class="btn secondary" data-act="all-wanted" data-ids="${ids.join(',')}">一式ほしい</button></div>`}

async function autoColors(dataUrl){return new Promise(resolve=>{const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas'),size=100;c.width=c.height=size;const g=c.getContext('2d',{willReadFrequently:true});g.clearRect(0,0,size,size);g.drawImage(img,0,0,size,size);const a=g.getImageData(0,0,size,size).data,counts={};let alphaCount=0,all=0;for(let i=0;i<a.length;i+=4){if(a[i+3]<100){alphaCount++;continue}const [r,green,b]=[a[i],a[i+1],a[i+2]],max=Math.max(r,green,b),min=Math.min(r,green,b),d=max-min,light=(max+min)/2;let key='';if(max<60)key='black';else if(d<18)key=light>215?'white':'gray';else if(light>239&&d<30)key='white';else{let h=0;if(d>0){if(max===r)h=((green-b)/d)%6;else if(max===green)h=(b-r)/d+2;else h=(r-green)/d+4;h=(h*60+360)%360;}if(light<145&&h>15&&h<56)key='brown';else if(h<13||h>=345)key='red';else if(h<345&&h>=300)key='pink';else if(h>=275)key='purple';else if(h>=245)key='blue';else if(h>=188)key='aqua';else if(h>=78)key='green';else if(h>=46)key='yellow';else if(h>=14)key='orange';else key='red'}counts[key]=(counts[key]||0)+1;all++}if(alphaCount<100){resolve(null);return}const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);resolve({main:sorted[0]?.[0]||'',sub:sorted[1]&&sorted[1][1]/all>=.07?sorted[1][0]:''})}catch(e){resolve(null)}};img.onerror=()=>resolve(null);img.src=dataUrl})}

const OFFICIAL_CSV_PATH='onegai_4dan_catalog.csv';
function importOfficialRows(rows){
 if(!rows.length||!rows.every(r=>r.catalog_id&&r.set_name&&r.series&&r.round))throw Error('公式CSVの必須列が不足しています');
 const grouped=new Map();
 for(const r of rows){
  const sid='official_'+r.catalog_id;
  if(!grouped.has(sid))grouped.set(sid,{...r,id:sid,partIds:[]});
  if(!r.part_id)continue;
  if(!['accessory','tops','bottom','shoes'].includes(r.part_type))throw Error('未知のパーツ種類: '+r.part_type);
  const pid='official_part_'+r.part_id;
  if(grouped.get(sid).partIds.includes(pid))continue;
  grouped.get(sid).partIds.push(pid);
  const existing=part(pid);
  const meta={id:pid,setId:sid,type:r.part_type,name:r.part_name||r.set_name,onepiece:r.onepiece==='yes',series:r.series,round:r.round,rarity:r.rarity,brand:r.brand||'',acquisition:r.acquisition||'',buzzPower:r.buzz_power!==''?Number(r.buzz_power):null,partCode:r.part_id,source:'official-csv'};
  if(existing)Object.assign(existing,meta);else db.parts.push(meta);
 }
 for(const [sid,g] of grouped){
  const meta={id:sid,name:g.set_name,series:g.series,round:g.round,rarity:g.rarity,brand:g.brand||'',acquisition:g.acquisition||'',officialGroup:g.official_group||'',startDate:g.start_date||'',endDate:g.end_date||'',verification:g.verification||'',partIds:g.partIds,source:'official-csv',fullGacha:g.acquisition==='フルコーデガチャ'};
  const existing=set(sid);if(existing)Object.assign(existing,meta);else db.sets.push(meta);
 }
 save();render();return grouped.size;
}

}
