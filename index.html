function close(){stopQRScan();modal='';if(page==='catalog')renderModalOnly();else render()}function show(x){if(!x?.startsWith('qr:')||!modal.startsWith('qr:'))stopQRScan();modal=x;renderModalOnly()}function dataFile(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function readFile(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f)})}function readImage(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}function parseCSV(s){let rows=[],row=[],field='',quote=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){field+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);let cols=rows.shift()?.map(x=>x.trim().replace(/^\uFEFF/,''))||[];return rows.map(row=>Object.fromEntries(cols.map((c,i)=>[c,(row[i]||'').trim()]))) }

async function autoColors(dataUrl){return new Promise(resolve=>{const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas'),size=100;c.width=c.height=size;const g=c.getContext('2d',{willReadFrequently:true});g.clearRect(0,0,size,size);g.drawImage(img,0,0,size,size);const a=g.getImageData(0,0,size,size).data,counts={};let alphaCount=0,all=0;for(let i=0;i<a.length;i+=4){if(a[i+3]<100){alphaCount++;continue}const [r,green,b]=[a[i],a[i+1],a[i+2]],max=Math.max(r,green,b),min=Math.min(r,green,b),d=max-min,light=(max+min)/2;let key='';if(max<60)key='black';else if(d<18)key=light>215?'white':'gray';else if(light>239&&d<30)key='white';else{let h=0;if(d>0){if(max===r)h=((green-b)/d)%6;else if(max===green)h=(b-r)/d+2;else h=(r-green)/d+4;h=(h*60+360)%360;}if(light<145&&h>15&&h<56)key='brown';else if(h<13||h>=345)key='red';else if(h<345&&h>=300)key='pink';else if(h>=275)key='purple';else if(h>=245)key='blue';else if(h>=188)key='aqua';else if(h>=78)key='green';else if(h>=46)key='yellow';else if(h>=14)key='orange';else key='red'}counts[key]=(counts[key]||0)+1;all++}if(alphaCount<100){resolve(null);return}const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);resolve({main:sorted[0]?.[0]||'',sub:sorted[1]&&sorted[1][1]/all>=.07?sorted[1][0]:''})}catch(e){resolve(null)}};img.onerror=()=>resolve(null);img.src=dataUrl})}

function normalizePartCode(code){return String(code||'').normalize('NFKC').replace(/\s+/g,'').toUpperCase()}
// Keep genuine shared pieces shared, but separate verified official card-number collisions.
// A first/legacy variant keeps its old part ID so saved personal data is not discarded.
function officialCodeVariant(series, code, setName){
 const c=normalizePartCode(code);
 if(series==='ひみつのアイプリバース'&&c==='APR6-009')return 'type';
 if(series!=='ワッチャプリマジ！')return '';
 if(c==='T-009'){
   if(setName==='ちゃおTシャツ')return 'chao';
   if(setName==='ハートいっぱい！こいかなTシャツ')return 'koikana';
 }
 if(['P-247','P-248','P-249','P-250'].includes(c) && setName==='フォーチュンスターブルー')return 'fortune-blue';
 if(c==='PM2-1-133')return 'type';
 if(c==='PM2-4-227'){
   if(setName==='こてつくんギャラクシーオレンジ')return 'orange';
   if(setName==='こてつくんスターダストブルー')return 'blue';
 }
 return '';
}
function officialCodeGroup(series, code, setName, type){
 const variant=officialCodeVariant(series,code,setName);
 if(variant==='type')return type;
 if(variant)return variant;
 return '';
}
function officialPartKey(p){
 if(!p?.partCode)return '';
 const c=normalizePartCode(p.partCode);
 const group=p.codeGroup||officialCodeGroup(p.series,c,p.setName||'',p.type);
 return `${p.series}\u0000${c}${group?'\u0000'+group:''}`;
}
// Compatibility alias for the shared-part reconciliation and unique-parts list.
function originalPartKey(p){return officialPartKey(p)}
function officialPartId(row){
 const code=normalizePartCode(row.part_id);
 if(!code)return 'official_part_nocode_'+row.catalog_id+'_'+row.part_type;
 const group=officialCodeGroup(row.series,code,row.set_name,row.part_type);
 const seriesTag=({'おねがいアイプリバース':'onegai','ひみつのアイプリバース':'himitsu','ワッチャプリマジ！':'primagi'})[row.series]||'other';
 // The first variant uses the original ID; subsequent distinct pieces have new IDs.
 let suffix='';
 if(row.series==='ひみつのアイプリバース'&&code==='APR6-009')suffix='_'+row.part_type;
 else if(row.series==='ワッチャプリマジ！'&&code==='T-009'&&group==='koikana')suffix='_koikana';
 else if(row.series==='ワッチャプリマジ！'&&code==='PM2-4-227'&&group==='blue')suffix='_blue';
 else if(row.series==='ワッチャプリマジ！'&&code==='PM2-1-133'&&group==='bottom')suffix='_bottom';
 else if(row.series==='ワッチャプリマジ！'&&['P-247','P-248','P-249','P-250'].includes(code)&&group==='fortune-blue')suffix='_fortune_blue';
 const candidate='official_part_'+seriesTag+'_'+code+suffix;
 // Previous versions could have saved non-canonical IDs for exactly the same physical piece.
 const old=db.parts.find(p=>p.source==='official-csv'&&p.series===row.series&&normalizePartCode(p.partCode)===code&&
   (p.codeGroup||officialCodeGroup(p.series,code,p.setName||'',p.type))===group&&
   (code!=='APR6-009'||p.type===row.part_type));
 return old?old.id:candidate;
}
function redirectPartId(oldId,newId){

 db.albums.forEach(a=>{a.partIds=(a.partIds||[]).map(id=>id===oldId?newId:id);if(a.layout?.[oldId]){a.layout[newId]=a.layout[newId]||a.layout[oldId];delete a.layout[oldId]}});
